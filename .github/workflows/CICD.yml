name: Update Packagist

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  update-packagist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Debug info
        env:
          GIT_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Tag: $GIT_REF"
          echo "Repository: $REPOSITORY"
          echo "Event name: $EVENT_NAME"
      
      # La API de Packagist solo documenta el token en la query string; sin -v para que curl no imprima la URL.
      - name: Update Packagist
        env:
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          echo "Updating Packagist..."
          curl -sS -XPOST -H'content-type:application/json' \
            "https://packagist.org/api/update-package?username=Fiscalapi&apiToken=${PACKAGIST_API_TOKEN}" \
            -d'{"repository":{"url":"https://github.com/FiscalAPI/fiscalapi-php"}}'
